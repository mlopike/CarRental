# Путь к файлу БД SQLite.
# Относительный путь будет разрешён относительно рабочей директории Tomcat.
# Можно использовать абсолютный путь: jdbc:sqlite:C:/data/car_rental.db
db.url=jdbc:sqlite:car_rental.db
db.driver=org.sqlite.JDBC

# Путь к init-скрипту (относительно classpath)
db.init.script=init.sql
